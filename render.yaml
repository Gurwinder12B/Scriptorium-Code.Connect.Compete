services:
  - type: web
    name: scriptorium-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://scriptorium-code.netlify.app,http://localhost:5173
      - key: DATABASE_URL
        value: sqlite:///scriptorium.db
      - key: JUDGE_PROVIDER
        value: mock
      - key: PORT
        value: 10000
